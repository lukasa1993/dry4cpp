[build-system]
requires=["setuptools>=69","wheel"]
build-backend="setuptools.build_meta"
[project]
name="dry4cpp"
version="0.1.0"
description="Duplication analysis for C++ projects"
readme="README.md"
requires-python=">=3.11"
license={text="MIT"}
[project.scripts]
dry4cpp="dry4cpp.cli:main"
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
testpaths=["tests"]
